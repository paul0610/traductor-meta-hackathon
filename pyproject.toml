[project]
name = "interprete"
version = "0.1.0"
description = "OS-level simultaneous ES<->EN interpreter for video calls, built on Muse Voice Transcribe and Muse Spark"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai==3.37.0",
    "websockets==17.3",
    "sounddevice==0.5.6",
    "numpy==2.5.4",
    "soxr==1.1.0",
    "keyboard==0.13.5",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyaudiowpatch==0.2.12.9",
    "pycaw==20260927",
    "comtypes==1.4.17",
    "pyside6-essentials==6.12.0",
    "qasync==0.28.0",
    "opencv-python==4.14.0.94",
    "pyvirtualcam==0.15.0",
    "torch==2.14.1",
    "transformers==5.20.2",
    "num2words==0.5.14",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: nothing published after this moment is a candidate. A bare date would be read in each
# machine's time zone, and the lock would fail to match anywhere east of Lima, so it is the end of Oct 22 in Lima, in UTC.
exclude-newer = "2026-10-23T05:00:00Z"

[tool.uv.sources]
# PyPI's torch for Linux carries CUDA, about 2.5 GB nothing here uses: MMS runs on the CPU. Windows and macOS wheels are CPU already.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
